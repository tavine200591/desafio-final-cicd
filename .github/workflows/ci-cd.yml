
name: Esteira Completa CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1 - TEST
  test:
    name: Test - Testes e Linter
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Executar Linter
        run: npm run lint

      - name: Validar projeto
        run: npm run validate

  # JOB 2 - BUILD
  build:
    name: Build - Criar e enviar artefato
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Criar pasta dist
        run: npm run build

      - name: Conferir arquivos
        run: |
          ls -la dist
          test -f dist/index.html

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error

  # JOB 3 - DEPLOY
  deploy:
    name: Deploy - GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/

      - name: Conferir artefato
        run: |
          ls -la dist
          test -f dist/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
